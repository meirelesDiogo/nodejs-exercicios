<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novo Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0f1c;
        --surface: #121a2b;
        --surface-alt: #182238;
        --border: #263252;
        --accent: #83cd29;
        --accent-dim: rgba(131, 205, 41, 0.14);
        --text: #e7edf7;
        --text-muted: #7c8aa8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }

      h2 {
        display: none;
      }

      form {
        width: 100%;
        max-width: 380px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px;
        box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      form::before {
        content: "Cadastro de usuário";
        display: block;
        font-family: "Space Grotesk", sans-serif;
        font-size: 20px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 4px;
      }

      input[type="text"],
      input[type="email"] {
        width: 100%;
        padding: 11px 12px;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input[type="text"]:focus,
      input[type="email"]:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-dim);
      }

      input[type="button"] {
        margin-top: 8px;
        padding: 13px;
        background: var(--accent);
        color: #0a1a02;
        border: none;
        border-radius: 8px;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: filter 0.15s ease, transform 0.05s ease;
      }

      input[type="button"]:hover {
        filter: brightness(1.08);
      }

      input[type="button"]:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <h2>Cadastro De Usuario</h2>

    <form method="post">
      Nome: <input type="text" id="nome" /> Cidade:
      <input type="text" id="cidade" /> Email: <input type="email" id="email" />

      <input type="button" id="cadastrar" value="Cadastrar" />
    </form>

    <script>
      const botao = document.getElementById("cadastrar");

      botao.addEventListener("click", async (e) => {
        e.preventDefault();

        const nome = document.getElementById("nome").value;
        const cidade = document.getElementById("cidade").value;
        const email = document.getElementById("email").value;

        const usuario = {
          nome: nome,
          cidade: cidade,
          email: email,
        };

        try {
          const resposta = await fetch("http://localhost:3000/pessoas", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(usuario),
          });

          if (resposta.ok) {
            alert("Usuário Cadastrado Com Sucesso");
            window.location.href = "/pessoas";
          } else {
            alert("Erro ao cadastrar usuário no servidor.");
          }
        } catch (erro) {
          console.error(erro);
          alert(
            "Não foi possível conectar ao servidor. O backend está rodando?",
          );
        }
      });
    </script>
  </body>
</html>
