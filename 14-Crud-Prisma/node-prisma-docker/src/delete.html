<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Tem Certeza que deseja Excluir o Usuario Com ID</h2>
    <input type="number" id="id" value="{{id}}" readonly />

    <input type="button" id="butao" value="SIM" />

    <script>
      const botao = document.getElementById("butao");
      const id = document.getElementById("id").value;
      botao.addEventListener("click", async (e) => {
        e.preventDefault();

        const usuario = {
          id: id,
        };

        const resposta = await fetch("http://localhost:3000/pessoas", {
          method: "DELETE",
          headers: {
            "Content-Type": "application/json;charset=utf-8",
          },
          body: JSON.stringify(usuario),
        });
      });
    </script>
  </body>
</html>
