<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remover Usuario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d1117;
        --ink: #e6e9ef;
        --ink-soft: #8b96a8;
        --teal: #4c7ef0;
        --amber: #e2a63d;
        --danger: #e2543d;
        --danger-dark: #bf4230;
        --card: #161b23;
        --line: #262d3a;
        --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        --sans: "Sora", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% 10%, rgba(226, 84, 61, 0.10), transparent 45%),
          radial-gradient(circle at 85% 90%, rgba(140, 150, 168, 0.08), transparent 40%),
          var(--bg);
        font-family: var(--sans);
        color: var(--ink);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 64px 20px;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      h2 {
        font-family: var(--sans);
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        max-width: 460px;
        margin: 0 0 28px;
        text-align: center;
        color: var(--ink);
      }

      .panel {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 20px 40px -24px rgba(22, 35, 58, 0.35);
        overflow: hidden;
      }

      .panel__request {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        background: #0a0d12;
        border-bottom: 1px solid var(--line);
      }

      .method {
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #0a0d12;
        background: var(--danger);
        padding: 4px 10px;
        border-radius: 4px;
      }

      .endpoint {
        font-family: var(--mono);
        font-size: 0.85rem;
        color: #a9b4c9;
        letter-spacing: 0.01em;
      }

      .panel__body {
        padding: 26px 24px 28px;
      }

      .field {
        margin-bottom: 20px;
      }

      .field label {
        display: block;
        font-family: var(--mono);
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--ink-soft);
        margin-bottom: 6px;
      }

      .field label::after {
        content: ":";
        color: var(--danger);
        margin-left: 1px;
      }

      #id {
        width: 100%;
        padding: 11px 12px;
        border: 1.5px solid var(--line);
        border-radius: 6px;
        background: #0d1117;
        font-family: var(--mono);
        font-size: 0.95rem;
        color: var(--ink);
      }

      #id:focus {
        outline: none;
        border-color: var(--danger);
      }

      button {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        padding: 13px 16px;
        border: none;
        border-radius: 6px;
        background: var(--danger);
        color: #0a0d12;
        font-family: var(--sans);
        font-size: 0.92rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.1s ease;
      }

      button:hover {
        background: var(--danger-dark);
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }

      .footnote {
        margin-top: 18px;
        text-align: center;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--ink-soft);
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }

      @media (max-width: 480px) {
        h2 {
          font-size: 1.25rem;
        }
        .panel__body {
          padding: 20px 18px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h2>Deletar o Usuario Com ID</h2>

      <div class="panel">
        <div class="panel__request">
          <span class="method">DELETE</span>
          <span class="endpoint">/remover/:id</span>
        </div>

        <div class="panel__body">
          <div class="field">
            <label for="id">id</label>
            <input type="number" value="{{id}}" id="id" readonly />
          </div>

          <button onclick="Apagar()">Apagar</button>
        </div>
      </div>

      <p class="footnote">servidor: <span>http://localhost:3000</span></p>
    </main>

    <script>
      function Apagar() {
        const id = document.getElementById("id").value;

        async function Req() {
          await fetch("/remover/" + id, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(id),
          });
        }
        Req();
        if (Req()) {
          alert("User Deletado ");
          return;
        }
        alert("Tente Novamente mais Tarde");
      }
    </script>
  </body>
</html>
