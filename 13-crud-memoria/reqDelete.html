<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Deletar o Usuario Com ID</h2>
    <strong><input type="number" value="{{id}}" id="id" readonly /></strong>
    <button onclick="Apagar()">Apagar</button>

    <script>
      function Apagar() {
        const id = document.getElementById("id").value;

        async function Req() {
          await fetch("/remover/" + id, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(id),
          });
        }
        Req();
        if (Req()) {
          alert("User Deletado ");
          return;
        }
        alert("Tente Novamente mais Tarde");
      }
    </script>
  </body>
</html>
