<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Alterar Usuário</title>
</head>
<body>
  <h2>Alterar Dados do Usuário</h2>
  
  <!-- Guardamos o ID em um input invisível para usar no JavaScript depois -->
  <input type="hidden" id="userId" value="{{id}}">

  <label>Nome:</label>
  <input type="text" id="nome" value="{{nome}}"><br><br>

  <label>Email:</label>
  <input type="email" id="email" value="{{email}}"><br><br>

  <label>Cidade:</label>
  <input type="text" id="cidade" value="{{cidade}}"><br><br>

  <button onclick="salvarAlteracoes()">Salvar</button>

  <script>
    function salvarAlteracoes() {
      const id = document.getElementById('userId').value;
      const dadosAtualizados = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        cidade: document.getElementById('cidade').value
      };

      // Dispara a requisição PUT enviando o JSON modificado
      fetch('/alterar/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dadosAtualizados)
      })
      .then(res => res.json())
      .then(dados => {
        alert(dados.mensagem);
        window.location.href = "/"; // Redireciona para a home
      });
    }
  </script>
</body>
</html>
