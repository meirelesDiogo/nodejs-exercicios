<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alterar Usuário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #0d1117;
      --ink: #e6e9ef;
      --ink-soft: #8b96a8;
      --teal: #4c7ef0;
      --teal-dark: #3a63c4;
      --amber: #e2a63d;
      --card: #161b23;
      --line: #262d3a;
      --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "Sora", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(76, 126, 240, 0.12), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(140, 150, 168, 0.08), transparent 40%),
        var(--bg);
      font-family: var(--sans);
      color: var(--ink);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 64px 20px;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    h2 {
      font-family: var(--sans);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      max-width: 460px;
      margin: 0 0 28px;
      text-align: center;
      color: var(--ink);
    }

    .panel {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 20px 40px -24px rgba(22, 35, 58, 0.35);
      overflow: hidden;
    }

    .panel__request {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      background: #0a0d12;
      border-bottom: 1px solid var(--line);
    }

    .method {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #0a0d12;
      background: var(--amber);
      padding: 4px 10px;
      border-radius: 4px;
    }

    .endpoint {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: #a9b4c9;
      letter-spacing: 0.01em;
    }

    .panel__body {
      padding: 26px 24px 28px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--ink-soft);
      margin-bottom: 6px;
    }

    .field label::after {
      content: ":";
      color: var(--teal);
      margin-left: 1px;
    }

    .field input[type="text"],
    .field input[type="email"] {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--line);
      border-radius: 6px;
      background: #0d1117;
      font-family: var(--mono);
      font-size: 0.88rem;
      color: var(--ink);
      transition:
        border-color 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    .field input[type="text"]:focus,
    .field input[type="email"]:focus {
      outline: none;
      border-color: var(--teal);
      background: #10151d;
      box-shadow: 0 0 0 3px rgba(76, 126, 240, 0.18);
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      margin-top: 8px;
      padding: 13px 16px;
      border: none;
      border-radius: 6px;
      background: var(--teal);
      color: #0a0d12;
      font-family: var(--sans);
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition:
        background 0.15s ease,
        transform 0.1s ease;
    }

    button:hover {
      background: var(--teal-dark);
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible {
      outline: 2px solid var(--amber);
      outline-offset: 2px;
    }

    .footnote {
      margin-top: 18px;
      text-align: center;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--ink-soft);
    }

    .footnote span {
      color: var(--teal-dark);
    }

    @media (prefers-reduced-motion: reduce) {
      button {
        transition: none;
      }
    }

    @media (max-width: 480px) {
      h2 {
        font-size: 1.25rem;
      }
      .panel__body {
        padding: 20px 18px 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h2>Alterar Dados do Usuário</h2>

    <div class="panel">
      <div class="panel__request">
        <span class="method">PUT</span>
        <span class="endpoint">/alterar/:id</span>
      </div>

      <div class="panel__body">
        <!-- Guardamos o ID em um input invisível para usar no JavaScript depois -->
        <input type="hidden" id="userId" value="{{id}}">

        <div class="field">
          <label for="nome">nome</label>
          <input type="text" id="nome" value="{{nome}}">
        </div>

        <div class="field">
          <label for="email">email</label>
          <input type="email" id="email" value="{{email}}">
        </div>

        <div class="field">
          <label for="cidade">cidade</label>
          <input type="text" id="cidade" value="{{cidade}}">
        </div>

        <button onclick="salvarAlteracoes()">Salvar</button>
      </div>
    </div>

    <p class="footnote">servidor: <span>http://localhost:3000</span></p>
  </main>

  <script>
    function salvarAlteracoes() {
      const id = document.getElementById('userId').value;
      const dadosAtualizados = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        cidade: document.getElementById('cidade').value
      };

      // Dispara a requisição PUT enviando o JSON modificado
      fetch('/alterar/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dadosAtualizados)
      })
      .then(res => res.json())
      .then(dados => {
        alert(dados.mensagem);
        window.location.href = "/"; // Redireciona para a home
      });
    }
  </script>
</body>
</html>
