<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /*So pra constar o css foi feito por IA. (n sou bom cm front) :)*/
      :root {
        --bg: #0d1117;
        --ink: #e6e9ef;
        --ink-soft: #8b96a8;
        --teal: #4c7ef0;
        --teal-dark: #3a63c4;
        --amber: #e2a63d;
        --card: #161b23;
        --line: #262d3a;
        --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        --sans: "Sora", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 15% 10%,
            rgba(76, 126, 240, 0.12),
            transparent 45%
          ),
          radial-gradient(
            circle at 85% 90%,
            rgba(140, 150, 168, 0.08),
            transparent 40%
          ),
          var(--bg);
        font-family: var(--sans);
        color: var(--ink);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 64px 20px;
      }

      h1 {
        font-family: var(--sans);
        font-size: 1.7rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.3;
        max-width: 560px;
        margin: 0 0 28px;
        text-align: center;
        color: var(--ink);
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .panel {
        width: 100%;
        max-width: 460px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 20px 40px -24px rgba(22, 35, 58, 0.35);
        overflow: hidden;
      }

      .panel__request {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 20px;
        background: #0a0d12;
        border-bottom: 1px solid var(--line);
      }

      .method {
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: #0a0d12;
        background: var(--teal);
        padding: 4px 10px;
        border-radius: 4px;
      }

      .endpoint {
        font-family: var(--mono);
        font-size: 0.85rem;
        color: #a9b4c9;
        letter-spacing: 0.01em;
      }

      .panel__body {
        padding: 26px 24px 28px;
      }

      .field {
        margin-bottom: 16px;
      }

      .field label {
        display: block;
        font-family: var(--mono);
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--ink-soft);
        margin-bottom: 6px;
      }

      .field label::after {
        content: ":";
        color: var(--teal);
        margin-left: 1px;
      }

      .field input[type="text"],
      .field input[type="email"] {
        width: 100%;
        padding: 11px 12px;
        border: 1.5px solid var(--line);
        border-radius: 6px;
        background: #0d1117;
        font-family: var(--mono);
        font-size: 0.88rem;
        color: var(--ink);
        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          box-shadow 0.15s ease;
      }

      .field input[type="text"]::placeholder,
      .field input[type="email"]::placeholder {
        color: #5b6779;
      }

      .field input[type="text"]:focus,
      .field input[type="email"]:focus {
        outline: none;
        border-color: var(--teal);
        background: #10151d;
        box-shadow: 0 0 0 3px rgba(76, 126, 240, 0.18);
      }

      #cadastrar {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        margin-top: 8px;
        padding: 13px 16px;
        border: none;
        border-radius: 6px;
        background: var(--teal);
        color: #0a0d12;
        font-family: var(--sans);
        font-size: 0.92rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.1s ease;
      }

      #cadastrar:hover {
        background: var(--teal-dark);
      }

      #cadastrar:active {
        transform: translateY(1px);
      }

      #cadastrar:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }

      .footnote {
        margin-top: 18px;
        text-align: center;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--ink-soft);
      }

      .footnote span {
        color: var(--teal-dark);
      }

      @media (prefers-reduced-motion: reduce) {
        #cadastrar {
          transition: none;
        }
      }

      @media (max-width: 480px) {
        h1 {
          font-size: 1.4rem;
        }
        .panel__body {
          padding: 20px 18px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Faça Seu Cadastro pro Servidor receber a requisição POST</h1>

      <div class="panel">
        <div class="panel__request">
          <span class="method">POST</span>
          <span class="endpoint">/usuarios</span>
        </div>

        <div class="panel__body">
          <div class="field">
            <label for="name">nome</label>
            <input
              type="text"
              id="name"
              placeholder="Seu nome completo"
              required
            />
          </div>

          <div class="field">
            <label for="email">email</label>
            <input
              type="email"
              id="email"
              placeholder="voce@exemplo.com"
              required
            />
          </div>

          <div class="field">
            <label for="city">cidade</label>
            <input type="text" id="city" placeholder="Sua cidade" required />
          </div>
          

          <input type="submit" value="Enviar Requisição" id="cadastrar" />
        </div>
      </div>

      <p class="footnote">servidor: <span>http://localhost:3000</span></p>
    </main>

    <script>
      const botao = document.querySelector("#cadastrar");
      botao.addEventListener("click", async () => {
        alert("Cadastrado com Sucesso");
        const nome = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const cidade = document.getElementById("city").value;
        
        const usuario = {
          nome: nome,
          email: email,
          cidade: cidade,
        };

        const resposta = await fetch("http://localhost:3000/usuarios", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify(usuario), // Json stringfy transforma objeto em json
        });
        const resultado = await resposta.json();
        console.log(resultado);
      });
    </script>
  </body>
</html>
